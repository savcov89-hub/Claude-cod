name: Deploy site

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check Supabase settings
        run: |
          test -n "${{ secrets.SUPABASE_PROJECT_ID }}" || { echo "::error::Add the SUPABASE_PROJECT_ID secret"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::Add the SUPABASE_ANON_KEY variable"; exit 1; }
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
