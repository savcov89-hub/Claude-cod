name: Deploy Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/**
      - src/catalog.ts
      - src/trainingRules.ts
      - src/analytics.ts
      - src/clock.ts
      - supabase/functions/**
      - package-lock.json
      - .github/workflows/supabase.yml

concurrency: supabase-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: mtheahciwliosrzadhbd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:api
      - name: Deploy function
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npx supabase functions deploy api --project-ref "$PROJECT_ID" --no-verify-jwt --use-api
      - name: No token
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::warning::SUPABASE_ACCESS_TOKEN secret is not set, so the function was built but not deployed."
