name: Deploy Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Everything the function is built from (esbuild bundles these from backend/server.ts).
    paths:
      - backend/**
      - src/analytics.ts
      - src/catalog.ts
      - src/clock.ts
      - src/draftMerge.ts
      - src/phases.ts
      - src/programMerge.ts
      - src/restrictions.ts
      - src/templates.ts
      - src/trainingRules.ts
      - src/types.ts
      - src/volume.ts
      - src/volumePlanner.ts
      - supabase/functions/**
      - package-lock.json
      - .github/workflows/supabase.yml

concurrency: supabase-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: mtheahciwliosrzadhbd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:api
      - name: Deploy function
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npx supabase functions deploy api --project-ref "$PROJECT_ID" --no-verify-jwt --use-api
      - name: Check the model (OPENROUTER_API_KEY)
        if: env.SUPABASE_ACCESS_TOKEN != ''
        continue-on-error: true
        run: |
          sleep 20
          curl -s -m 120 "https://$PROJECT_ID.supabase.co/functions/v1/api/api/ai/status"; echo
      - name: No token
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::warning::SUPABASE_ACCESS_TOKEN secret is not set, so the function was built but not deployed."
